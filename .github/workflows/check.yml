name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned to the newest Xcode on GitHub's macos-26 image (26.0 to 26.6 as of 2026-11-02).
    # Development uses Xcode 27.2, which no hosted runner has yet. Move to 27.x once the image
    # lists it; until then a lint or build difference between the two shows up here first.
    runs-on: macos-26
    env:
      XCODE_VERSION: "26.6"
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} is not on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          swift --version
      - name: Check
        run: scripts/check
